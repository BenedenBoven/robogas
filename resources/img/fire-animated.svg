<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  role="img"
  aria-labelledby="fire-title"
  tabindex="0"
>
  <title id="fire-title">Vlam</title>

  <defs>
    <clipPath id="fire-clip">
      <rect x="14.7" y="8.2" width="90.6" height="103.5" />
    </clipPath>

    <!-- Zorgt voor de kleine, organische vervorming van het vuur. -->
    <filter id="fire-wobble" x="-20%" y="-15%" width="140%" height="135%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.055"
        numOctaves="2"
        seed="8"
        result="noise"
      >
        <animate
          attributeName="baseFrequency"
          dur="0.7s"
          values="0.012 0.055;0.018 0.08;0.01 0.06;0.012 0.055"
          repeatCount="indefinite"
        />
      </feTurbulence>
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="2.6"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </defs>

  <style>
    .fire-shape {
      fill: var(--fire-color, #1d1d1b);
      transform-box: fill-box;
      transform-origin: 50% 100%;
      will-change: transform;
    }

    svg:hover .fire-shape,
    svg:focus-visible .fire-shape,
    svg.is-burning .fire-shape {
      filter: url(#fire-wobble);
      animation: fire-burning 0.55s ease-in-out infinite;
    }

    @keyframes fire-burning {
      0% {
        transform: translate(-0.4px, 0.5px) scale(1.01, 0.98) skewX(-1.4deg);
      }
      25% {
        transform: translate(0.7px, -0.8px) scale(0.98, 1.035) skewX(1.8deg);
      }
      50% {
        transform: translate(-0.6px, -0.2px) scale(1.025, 1.01) skewX(-1deg);
      }
      75% {
        transform: translate(0.5px, -1px) scale(0.99, 1.045) skewX(1.2deg);
      }
      100% {
        transform: translate(-0.2px, 0.2px) scale(1.015, 1) skewX(-0.8deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      svg:hover .fire-shape,
      svg:focus-visible .fire-shape,
      svg.is-burning .fire-shape {
        filter: none;
        animation: none;
      }
    }
  </style>

  <g clip-path="url(#fire-clip)">
    <path
      class="fire-shape"
      d="M60.3,92.4c5.1,0,9.6-1.4,13.9-4.2,8.5-5.9,10.8-17.8,5.7-27.2-.6-1.1-1.1-2.3-2-3.4l-10.2,11.9s-16.5-20.9-17.6-22.4c-8.5,10.5-12.8,16.4-12.8,23.2,0,13.9,10.2,22.1,23,22.1M46.9,9.3c1.6-1.5,4-1.5,5.6,0,5.6,5.2,10.8,10.9,15.7,17,2.2-2.9,4.8-6.1,7.5-8.7,1.6-1.5,4.1-1.5,5.7,0,7,6.7,12.9,15.5,17.1,23.9,4.1,8.2,6.8,16.7,6.8,22.6,0,25.8-20.2,47.6-45.3,47.6S14.7,90,14.7,64.2s3.6-17.2,9.2-26.6c5.6-9.5,13.6-19.4,23-28.2"
    />
  </g>
</svg>
